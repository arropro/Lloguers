<style>
#splash{position:fixed;inset:0;z-index:9999;background:var(--sbg,#0B1430);transition:opacity .45s ease;display:grid;place-items:center}
#splash img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
  clip-path:inset(calc(50% - 64px) calc(50% - 64px) round 28px);transition:clip-path .75s cubic-bezier(.6,0,.2,1)}
#splash.open img{clip-path:inset(0 round 0)}
#splash picture{position:absolute;inset:0}
#splash .ic{position:relative;z-index:1;width:128px;height:128px;border-radius:28px;object-fit:cover;clip-path:none;inset:auto;transition:transform .75s cubic-bezier(.6,0,.2,1),opacity .5s ease}
#splash.open .ic{transform:scale(2.4);opacity:0}
#splash.hide{opacity:0;pointer-events:none}
</style>

<div id="splash" aria-hidden="true"><img class="ic" src="/icon-512.png" alt=""><picture><source media="(orientation: landscape)" srcset="/splash-wide.jpg"><img src="/splash.jpg" alt=""></picture></div>
<script>
(function () {
  // Pantalla d'inici: comença igual que la d'Android (color de fons + icona petita al mig)
  // i la imatge s'obre fins a ocupar tota la pantalla.
  var s = document.getElementById("splash"), seen = false;
  try { seen = sessionStorage.getItem("lloguers-splash") === "1"; sessionStorage.setItem("lloguers-splash", "1"); } catch (e) {}
  if (seen) { s.remove(); return; }
  try { var bg = localStorage.getItem("lloguers-splash-bg"); if (bg) s.style.setProperty("--sbg", bg); } catch (e) {}
  fetch("/api/settings", { credentials: "same-origin" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
    if (d && d.bg) { s.style.setProperty("--sbg", d.bg); try { localStorage.setItem("lloguers-splash-bg", d.bg); } catch (e) {} }
  }).catch(function () {});
  var img = s.querySelector("picture img"), done = false;
  function open() { requestAnimationFrame(function () { s.classList.add("open"); }); setTimeout(hide, 1900); }
  function hide() { if (done) return; done = true; s.classList.add("hide"); setTimeout(function () { s.remove(); }, 500); }
  s.addEventListener("click", hide);
  if (img.complete) setTimeout(open, 150); else { img.addEventListener("load", function () { setTimeout(open, 150); }); img.addEventListener("error", hide); }
  setTimeout(hide, 5000);
})();
</script>

/* Layout: app shell — night-blue rail with nav and the flats (bottom bar on phones); content column max 1080px; Resum opens with a night hero. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --sunk:#F3F5F9; --ink:#0D1626; --muted:#5B677A; --line:#DCE2EB;
  --accent:#2F5BEA; --accent-ink:#FFFFFF; --accent-soft:#E2E9FD;
  --emp:#7A4FD0; --emp-soft:#EEE6FC;
  --in:#1F8A5B; --in-soft:#DDF3E8; --out:#D2462E; --out-soft:#FBE5E0; --warn:#A86A00; --warn-soft:#FCEFD6;
  --night:#0E1B3A; --night-2:#1D3576; --gold:#F5B841; --on-night:#EAF0FF; --on-night-muted:#A9B6D6;
  --sky1:#C9DAFF; --sky2:#F1F5FF; --win:#26354F;
  --shadow:0 1px 2px rgb(13 22 38 / .05), 0 10px 28px -14px rgb(13 22 38 / .22);
  --display:"Unbounded", "Segoe UI", system-ui, sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

  --accent:#7D9BFF; --accent-ink:#08112A; --accent-soft:#18254A; --emp:#B597FF; --emp-soft:#251B42;
  --in:#4FD18F; --in-soft:#0F2A1F; --out:#FF8A72; --out-soft:#3A1B16; --warn:#F2B84B; --warn-soft:#33260E;
  --night:#0A1530; --night-2:#18306A; --sky1:#1A2C5C; --sky2:#26407A; --win:#0A1222;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 12px 30px -14px rgb(0 0 0 / .7); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#080E1A; --surface:#0F1828; --sunk:#0B1321; --ink:#E6ECF5; --muted:#8F9CB3; --line:#1C2940;
  --accent:#7D9BFF; --accent-ink:#08112A; --accent-soft:#18254A; --emp:#B597FF; --emp-soft:#251B42;

/* Layout: ledger app — sticky header with tabs (bottom bar on phones); property page uses sub-tabs so each topic has its own screen. */
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.35rem} h2{font-size:1.15rem} h3{font-size:1.02rem}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:-.02em}
.muted{color:var(--muted)} .small{font-size:.85rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:0}


.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.panel-h h2,.panel-h h3{margin-right:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--out);border-color:var(--out-soft)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.55;cursor:default}
.crumb{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:600}
.chip{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;display:inline-block}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--in-soft);color:var(--in)}
.chip.bad{background:var(--out-soft);color:var(--out)}
.chip.acc{background:var(--accent-soft);color:var(--ink)}
.chip.emp{background:var(--emp-soft);color:var(--emp)}
.pos{color:var(--in)} .neg{color:var(--out)}

.month{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}

.month .net{background:var(--accent-soft)}

.tbl-wrap{overflow-x:auto}

table.tbl th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}

table.tbl td.r,table.tbl th.r{text-align:right}

table.sum td{padding:6px 0;border-bottom:1px solid var(--line)}

.todo{list-style:none;margin:0;padding:0;display:grid;gap:8px}

.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}

.pcard:hover{border-color:var(--accent)}
.pcard.emp{border-top:4px solid var(--emp)}

.pcard .foot{display:grid;grid-template-columns:1fr auto;gap:4px 10px;border-top:1px dashed var(--line);padding-top:10px;font-size:.88rem}

.phead{display:grid;gap:6px}
.phead .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

.dlist{list-style:none;margin:0;padding:0}

.scanpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ===== redesign ===== */

  padding:calc(22px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}

<script>
"use strict";
/* ================= basics ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = new Intl.NumberFormat("ca-ES",{style:"currency",currency:"EUR"});
const eur = n => fmt.format(Number(n)||0);
const sum = (list, f=x=>x.amount) => list.reduce((s,x)=>s+(Number(f(x))||0),0);
const today = () => new Date().toLocaleDateString("sv-SE");
const dShift = days => { const d=new Date(); d.setDate(d.getDate()+days); return d.toLocaleDateString("sv-SE"); };
const curMonth = () => today().slice(0,7);
const ymOf = d => String(d||"").slice(0,7);
const addMonths = (m, k) => { const [y,mo]=m.split("-").map(Number); return new Date(y,mo-1+k,1).toLocaleDateString("sv-SE").slice(0,7); };
const monthName = (m, style="long") => { const [y,mo]=m.split("-"); return new Date(+y,+mo-1,1).toLocaleDateString("ca-ES",{month:style}).replace(".",""); };
const fmtDate = (d, yr=true) => { if(!d) return ""; const [y,m,dd]=d.split("-"); return `${+dd} ${monthName(y+"-"+m,"short")}${yr?" "+y:""}`; };
const parseAmt = v => { if (typeof v === "number") return Math.round(v*100)/100; let s = String(v||"").trim().replace(/[\s€]/g,""); if(!s) return 0; if (s.includes(",")) s = s.replace(/\./g,"").replace(",","."); const n = parseFloat(s); return isFinite(n) ? Math.round(n*100)/100 : 0; };
const amtStr = n => (n===0||n) && n!=="" ? String(n).replace(".",",") : "";
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
const pct = v => v==null || !isFinite(v) ? "—" : v.toLocaleString("ca-ES",{maximumFractionDigits:1})+" %";
const isDate = v => typeof v==="string" && /^\d{4}-\d{2}-\d{2}$/.test(v);
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();

const CATS = {
  despesa: ["Subministraments","Comunitat","IBI i taxes","Assegurança","Derrama","Reparació i manteniment","Gestoria i honoraris","Comissió plataforma","Mobiliari i millores","Despeses de compra","Altres despeses"],
  ingres: ["Lloguer","Fiança","Subministraments refacturats","Altres ingressos"]
};
const INVEST = ["Mobiliari i millores","Despeses de compra","Derrama"];
const PTYPES = ["Pis","Casa","Local","Altres"];
const MODES = {tradicional:"Lloguer tradicional", habitacions:"Lloguer per habitacions", empresa:"Lloguer per empreses"};
const modeChip = (p, extra="") => p && p.rentalMode==="empresa" ? `<span class="chip emp">Lloguer per empreses${extra}</span>` : p && p.rentalMode==="habitacions" ? `<span class="chip hab">Lloguer per habitacions</span>` : `<span class="chip">Lloguer tradicional</span>`;
const isHab = p => !!p && p.rentalMode==="habitacions";
function modeSeg(cur){ return `<div class="seg3" role="radiogroup" aria-label="Tipus de lloguer">${Object.entries(MODES).map(([v,l])=>`<label><input type="radio" name="rentalMode" value="${v}" ${cur===v?"checked":""}>${l}</label>`).join("")}</div>`; }
function needMode(f){ if(f.querySelector("input[name=rentalMode]:checked")) return false; const sg=f.querySelector(".seg3"); if(sg){ sg.classList.add("need"); sg.scrollIntoView({block:"center",behavior:"smooth"}); } toast("Tria el tipus de lloguer."); return true; }
const FOLDERS = [["propietat","Propietat i escriptures"],["hipoteca","Hipoteca"],["contractes","Contractes"],["subministraments","Subministraments"],["assegurances","Assegurances"],["impostos","Impostos i taxes"],["factures","Factures i rebuts"],["altres","Altres"]];
const FIDS = FOLDERS.map(f=>f[0]);
const folderNameOf = id => (FOLDERS.find(f=>f[0]===id)||[0,"Altres"])[1];
const KINDS = {alie:"No relacionat", foto:"Foto del pis", factura:"Factura", rebut:"Rebut de pagament", lloguer:"Cobrament de lloguer", escriptura:"Escriptura", contracte:"Contracte", actualitzacio:"Actualització de renda", altre:"Document"};
const kindFolder = k => ({escriptura:"propietat", contracte:"contractes", actualitzacio:"contractes", factura:"factures", rebut:"factures"})[k] || "altres";

const S = { props:[], contracts:[], moves:[], docs:[], inbox:[], loaded:{props:false,contracts:false,moves:false,docs:false,inbox:false}, boot:true, err:null,
  view:"resum", propId:null, tab:"resum", py:String(new Date().getFullYear()), open:{},
  f:{year:String(new Date().getFullYear()), prop:"", type:""} };
let downloadsCap=null;
S.open = new Set(); S.shut = new Set();
const shortName = n => { const a=String(n||"").split(/,| i /).map(x=>x.trim()).filter(Boolean); return a.length>1 ? a[0]+" +"+(a.length-1) : (a[0]||""); };
document.addEventListener("toggle", e=>{ const d=e.target; if(d && d.dataset && d.dataset.fold){ if(d.open){ S.open.add(d.dataset.fold); S.shut.delete(d.dataset.fold); } else { S.open.delete(d.dataset.fold); S.shut.add(d.dataset.fold); } } }, true);
let db=null, assets=null, sample=null, imgOk=false, maxImg=0, scanCtl=null;

/* ================= boot ================= */
async function init(){
  const c = window.claude;
  if (!c || !c.use){ S.boot=false; S.err="nodb"; render(); return; }
  db = await c.use("db").catch(()=>null);
  S.boot=false;
  if (!db){ S.err="nodb"; render(); return; }
  listen("props", db.collection("props"));
  listen("contracts", db.collection("contracts"));
  listen("moves", db.collection("moves").orderBy("date","desc").limit(1000));
  listen("docs", db.collection("docs"));
  listen("inbox", db.collection("inbox"));
  c.use("assets").then(a=>{ assets=a; }).catch(()=>{});
  aiBalance();
  c.use("downloads").then(d=>{ downloadsCap=d; }).catch(()=>{});
  c.use("sample").then(async s=>{ sample=s; if(s){ const l=await s.limits().catch(()=>null); imgOk=!!(l&&l.images); maxImg=(l&&l.images&&l.images.maxCount)||0; } scheduleAuto(); }).catch(()=>{});
}
// Saldo de la IA (només a l'app pròpia): avisa a "Per revisar" quan se n'acaba.
function aiBalance(){ if(!window.LLOGUERS_STANDALONE) return; fetch("/api/ai/balance",{credentials:"same-origin"}).then(r=>r.ok?r.json():null).then(b=>{ S.aiBal=b; render(); }).catch(()=>{}); }
setInterval(()=>{ if(document.visibilityState==="visible") aiBalance(); }, 10*60*1000);
window.addEventListener("ai-nobal", ()=>setTimeout(aiBalance,500));
function listen(key, q){
  q.onSnapshot(snap=>{ S[key]=snap.docs.map(d=>({id:d.id,...d.data()})); S.loaded[key]=true; render(); scheduleAuto(); },

const MTG_CACHE=new Map();

    if(anchor && mo===anchor.m){ bal=anchor.bal; if(!(+m.payment>0) && n>0) q=Math.round(annuity(bal,r,n-i-1)*100)/100; }

}
const mtgPay=(M,mo)=>{ const e=M.sch.find(x=>x.m===mo); return e?e.pay:0; };

const COPYICON=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 01-1-1V4a1 1 0 011-1h10a1 1 0 011 1v1"/></svg>`;
const copyBtn = v => v ? `<button type="button" class="cpb" data-copy="${esc(v)}" title="Copiar" aria-label="Copiar ${esc(v)}">${COPYICON}</button>` : "";
const contractsOf = pid => S.contracts.filter(c=>c.propId===pid).sort((a,b)=>String(b.start||"").localeCompare(String(a.start||"")));
const current = pid => S.contracts.filter(c=>(!pid||c.propId===pid) && propById(c.propId) && cStatus(c)==="vigent");
const rentAt = (c, mo=curMonth()) => { let r=+c.rent||0; (c.rents||[]).filter(x=>x&&x.from&&x.from<=mo).sort((a,b)=>a.from.localeCompare(b.from)).forEach(x=>{ if(+x.amount>0) r=+x.amount; }); return r; };
const extrasOf = (c, freq) => sum((c.extras||[]).filter(x=>x && (x.freq||"mensual")===freq), x=>+x.amount||0);
const isTotalMode = c => c.priceMode==="total";
const addMonthsDate = (d, k) => { const [y,m,dd]=d.split("-").map(Number); const t=new Date(y,m-1+k,dd); if(t.getDate()!==dd) t.setDate(0); return t.toLocaleDateString("sv-SE"); };
const PERIOD_CACHE=new Map();
function periodFrac(c, mo){ // share of a monthly period that starts in month mo (billing periods run from the start day)

  const key=c.start+"|"+(c.end||"")+"|"+mo; if(PERIOD_CACHE.has(key)) return PERIOD_CACHE.get(key);

const feeVatOf = c => c.feeVat!=null && c.feeVat!=="" ? +c.feeVat : (/homy/i.test(c.platform||"") ? 21 : 0);

}
const feeOn = (c, rent) => Math.round(rent*(+c.feePct||0)/100*(1+feeVatOf(c)/100)*100)/100;
const hasPlan = c => isTotalMode(c) || (c.adds||[]).length>0;

const nifTag = c => c.cif ? `<span class="nif">NIF ${esc(c.cif)}${copyBtn(c.cif)}</span>` : "";
const commMoves = c => { const refs=[c.bookingRef, ...(c.docs||[]).map(d=>d.ref)].map(z=>String(z||"").replace(/[^A-Za-z0-9]/g,"").toUpperCase()).filter(z=>z.length>=6);
  return VM().filter(m=>m.type==="despesa" && m.category==="Comissió plataforma" && m.propId===c.propId && (m.contractId===c.id || (!m.contractId && ((refs.length && refs.some(r=>String((m.concept||"")+" "+(m.srcKey||"")+" "+(m.ref||"")).replace(/[^A-Za-z0-9]/g,"").toUpperCase().includes(r))) || (c.start && m.date>=(()=>{ const d=new Date(c.start); d.setDate(d.getDate()-15); return d.toLocaleDateString("sv-SE"); })() && (!c.end || m.date<=c.end)))))); };
const SIDE_RE=/pr[oò]rrog|anex|annex|fian|recib|declara|resguard/i;
const isMainDoc = d => d && (/^contracte$/i.test(d.label||"") || (/contrat|contracte|contract/i.test(d.name||"") && !SIDE_RE.test((d.name||"")+" "+(d.label||""))));
const hasMainDoc = c => (c.docs||[]).some(isMainDoc);
const contractRentTotal = c => { if(!c.start) return 0; let t=0, mo=ymOf(c.start); const last=ymOf(c.end||c.start); for(let i=0;mo<=last&&i<120;i++){ t+=expParts(c,mo).rent; mo=addMonths(mo,1); } (c.adds||[]).forEach(a=>{ if(a&&a.mo>last) t+=+a.amount||0; }); return Math.round(t*100)/100; };
const contractTotal = c => { if(!c.start) return 0; let t=0, mo=ymOf(c.start); const last=ymOf(c.end||c.start); for(let i=0;mo<=last&&i<120;i++){ t+=expectedBase(c,mo); mo=addMonths(mo,1); } (c.adds||[]).forEach(a=>{ if(a&&a.mo>last) t+=+a.amount||0; }); return Math.round(t*100)/100; };

const monthLabel = mo => `${monthName(mo)} ${mo.slice(0,4)}`;
const range = list => list.length ? (list.length===1 ? monthLabel(list[0]) : `${monthName(list[0],"short")} ${list[0].slice(0,4)} – ${monthName(list[list.length-1],"short")} ${list[list.length-1].slice(0,4)}`) : "";

function fireworks(force){
  const hero=document.querySelector("main .hero"), tw=hero&&hero.querySelector(".htower"); if(!tw) return;
  if(!force && Date.now()-FW_LAST<60000) return; FW_LAST=Date.now();
  // El llenç va fora de la pantalla de l'app (a sobre de tot), perquè si l'app es redibuixa mentre dura no s'esborrin els focs.
  const old=document.querySelector("canvas.fw"); if(old) old.remove();
  const dpr=Math.min(2,window.devicePixelRatio||1), hr=hero.getBoundingClientRect(), W=hr.width, H=hr.height;
  const cv=document.createElement("canvas"); cv.className="fw"; cv.style.cssText=`left:${hr.left}px;top:${hr.top}px;width:${W}px;height:${H}px;border-radius:${getComputedStyle(hero).borderRadius}`; document.body.appendChild(cv);
  cv.width=W*dpr; cv.height=H*dpr; const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  const sr=tw.querySelector("svg").getBoundingClientRect(), bx=sr.left-hr.left, by=sr.top-hr.top, bw=sr.width, bh=sr.height;
  const COLS=["#FFD66B","#F5B931","#FF8A5B","#FF5C8A","#7EE0A8","#6FA8FF","#C59BFF","#FFF4D6"];
  const pick=()=>COLS[Math.random()*COLS.length|0], rockets=[], parts=[], T0=performance.now(), DUR=5200;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function launch(){
    const r=Math.random(); let tx,ty;
    if(r<.4){ tx=bx+bw*(.1+Math.random()*.8); ty=by-bh*(.02+Math.random()*.22); }
    else if(r<.7){ tx=bx-bw*(.25+Math.random()*.7); ty=by+bh*(Math.random()*.55); }
    else { tx=bx+bw*(1.25+Math.random()*.7); ty=by+bh*(Math.random()*.55); }
    tx=clamp(tx,16,W-16); ty=clamp(ty,16,H-30);
    rockets.push({x:bx+bw*(Math.random()<.5?.12:.88), y:by+bh*.95, tx, ty, t:0, d:420+Math.random()*260, c:pick()});
  }
  function burst(r){
    const n=36+(Math.random()*22|0), sp=1.5+Math.random()*1.5, c2=Math.random()<.45?pick():r.c;
    for(let i=0;i<n;i++){ const a=i/n*Math.PI*2+Math.random()*.25, v=sp*(.55+Math.random()*.55);
      parts.push({x:r.tx,y:r.ty,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:i%3?r.c:c2,s:1.3+Math.random()*1.4,tw:Math.random()<.3}); }
  }
  let next=0, last=T0;
  function step(now){
    const dt=Math.min(40,now-last)/16.7, el=now-T0; last=now;
    if(el<DUR-1400 && el>=next){ launch(); if(Math.random()<.35) launch(); next=el+240+Math.random()*320; }
    ctx.globalCompositeOperation="destination-out"; ctx.fillStyle="rgba(0,0,0,.26)"; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";
    for(let i=rockets.length-1;i>=0;i--){ const r=rockets[i]; r.t+=16.7*dt; const k=Math.min(1,r.t/r.d), e=1-(1-k)*(1-k);
      ctx.fillStyle=r.c; ctx.beginPath(); ctx.arc(r.x+(r.tx-r.x)*e, r.y+(r.ty-r.y)*e, 1.8, 0, 7); ctx.fill();
      if(k>=1){ burst(r); rockets.splice(i,1); } }
    for(let i=parts.length-1;i>=0;i--){ const p=parts[i];
      p.vx*=Math.pow(.965,dt); p.vy=p.vy*Math.pow(.965,dt)+.03*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.l-=.011*dt;
      if(p.l<=0){ parts.splice(i,1); continue; }
      ctx.globalAlpha=Math.max(0,p.l)*(p.tw&&Math.random()<.4?.3:1); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.s*(.45+p.l*.55),0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    if(el<DUR||parts.length||rockets.length) requestAnimationFrame(step); else cv.remove();
  }
  requestAnimationFrame(step);
}
function fitNums(){

function niceMax(v){ if(v<=0) return 100; const p=Math.pow(10,Math.floor(Math.log10(v))); const f=v/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }

  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingressos i despeses dels últims 12 mesos"><defs><linearGradient id="gIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--in)"/><stop offset="1" style="stop-color:var(--in);stop-opacity:.55"/></linearGradient><linearGradient id="gOut" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--out)"/><stop offset="1" style="stop-color:var(--out);stop-opacity:.55"/></linearGradient></defs>`;
  [0,max/2,max].forEach(t=>{ s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${short(t)}</text>`; });
  data.forEach((x,i)=>{ const cx=L+cw*i+cw/2;
    if(i===11) s+=`<rect class="cur" x="${L+cw*i+2}" y="${T}" width="${cw-4}" height="${H-T-B}" rx="6"/>`;

    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${monthName(x.m,"short")}</text>`; });
  return `<div class="tbl-wrap">${s}</svg></div>`;
}

function missingFor(p){

function gestorData(y, pids){
  const Y=String(y), a=Y+"-01", b=Y+"-12", inY=d=>String(d||"").startsWith(Y);
  const props=sortedProps().filter(p=>pids.includes(p.id));
  const resum=[], movs=[], cons=[], falta=[];
  for(const p of props){
    const ms=movesOf(p.id).filter(m=>inY(m.date)).sort((x,z)=>String(x.date).localeCompare(String(z.date)));
    const rent=sum(ms.filter(m=>m.type==="ingres"&&m.category==="Lloguer"),m=>+m.amount||0), othIn=sum(ms.filter(m=>m.type==="ingres"&&m.category!=="Lloguer"&&m.category!=="Fiança"),m=>+m.amount||0);
    const byCat={}; ms.filter(m=>m.type==="despesa").forEach(m=>{ byCat[m.category||"Altres despeses"]=(byCat[m.category||"Altres despeses"]||0)+(+m.amount||0); });
    const M=mtg(p), intY=M?Math.round(mtgSum(M,a,b,"int")*100)/100:0, capY=M?Math.round(mtgSum(M,a,b,"cap")*100)/100:0;
    let days=0; const d0=new Date(y,0,1), d1=new Date(y,11,31); for(let d=new Date(d0); d<=d1; d.setDate(d.getDate()+1)){ const ds=d.toLocaleDateString("sv-SE"); if(contractsOf(p.id).some(c=>c.start&&c.start<=ds&&(!c.end||c.end>=ds)&&!(c.ended&&c.endDate&&c.endDate<ds))) days++; }
    const r2=v=>Math.round((v||0)*100)/100;
    const row={"Pis":p.name,"Adreça":p.address||"","Ref. cadastral":p.cadastre||"","Data de compra":p.purchaseDate||"","Preu de compra":+p.price||0,"Dies llogat":days,"Lloguers cobrats":r2(rent),"Altres ingressos":r2(othIn)};
    CATS.despesa.forEach(c=>{ row[c==="Derrama"?"Derrama (quota extraordinària comunitat)":c+(INVEST.includes(c)?" (inversió)":"")]=r2(byCat[c]); });
    row["Interessos hipoteca (estimats)"]=intY; row["Capital hipoteca retornat"]=capY;
    row["Despeses ordinàries (sense derrames ni inversions)"]=r2(sum(Object.entries(byCat).filter(([c])=>!INVEST.includes(c)),([,v])=>v)+intY);
    resum.push(row);
    ms.forEach(m=>movs.push({"Data":m.date,"Pis":p.name,"Tipus":m.type==="ingres"?"Ingrés":"Despesa","Categoria":m.category||"","Proveïdor / pagador":m.provider||"","Concepte":m.concept||"","Import":+m.amount||0,"IVA":+m.vat||"","Document":m.docId?gName(m.docName||m.docId,m.docMime):""}));
    contractsOf(p.id).filter(c=>c.start&&c.start<=Y+"-12-31"&&(!c.end||c.end>=a+"-01")).forEach(c=>cons.push({"Pis":p.name,"Inquilí / empresa":c.tenantName||"","NIF":c.cif||"","Tipus":c.tenantType==="empresa"?"Empresa":"Particular","Inici":c.start||"","Final":c.end||"",["Dies llogat "+Y]:stayDays(c,y)||"","Dies totals":stayDays(c)||"","Renda":isTotalMode(c)?contractRentTotal(c):rentAt(c,b),"Tipus de preu":isTotalMode(c)?"Total estada":"Mensual","Repercussions/mes":extrasOf(c,"mensual")||"",["Renda cobrada "+Y]:Math.round(sum(movesOf(p.id).filter(m=>m.type==="ingres"&&m.category==="Lloguer"&&m.contractId===c.id&&String(m.date).startsWith(Y)))*100)/100,"Comissió plataforma":+c.feePct?Math.round(sum(commMoves(c).filter(m=>String(m.date).startsWith(Y)))*100)/100:"","Fiança":+c.deposit||0,"Fiança dipositada":c.tenantType==="empresa"?"No cal":(c.incasol?"Sí":"No")}));
    if(M && !S.docs.some(d=>d.propId===p.id&&d.folder==="hipoteca"&&/certific|interes/i.test((d.title||"")+(d.fileName||""))&&String(d.date||"")>=Y)) falta.push({"Pis":p.name,"Què falta":`Certificat d'interessos de la hipoteca ${y} (el dona el banc); els interessos del resum són una estimació`});
    missingFor(p).forEach(x=>falta.push({"Pis":p.name,"Què falta":x.txt.replace(/<[^>]+>/g,"")}));
  }
  return {props, resum, movs, cons, falta};
}
const gSafe = t => String(t||"").replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g," ").trim().slice(0,120);

// copiar o obrir en qualsevol navegador. Les descàrregues fetes des de l'app Android les passava a una altra app.
async function uploadLink(blob, name, type, btn){
  const id=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,"0")).join(""), CH=20*1024*1024, parts=Math.max(1,Math.ceil(blob.size/CH));
  const lbl=btn&&btn.innerHTML;
  try{
    for(let i=0;i<parts;i++){ if(btn) btn.innerHTML=`Preparant… ${Math.round(i/parts*100)}%`;
      const r=await fetch(`/api/dl/part?id=${id}&n=${i}`,{method:"POST",credentials:"same-origin",body:blob.slice(i*CH,(i+1)*CH)}); if(!r.ok) throw new Error("part"); }
    const d=await (await fetch("/api/dl/done",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify({id,parts,name,type,size:blob.size})})).json();
    return location.origin+d.url;
  }catch{ toast("No s'ha pogut preparar l'enllaç. Torna-ho a provar."); return ""; }
  finally{ if(btn) btn.innerHTML=lbl; }
}

function fixEmAddr(p, a){

function pdfW(t, bold, size){ const A=bold?HWA.b:HWA.n; let w=0; for(const ch of String(t)){ let c=ch==="€"?36:(ch.normalize("NFD")[0]||"?").charCodeAt(0); if(c<32||c>126) c=63; w+=A[c-32]; } return w*size/1000; }
function pdfTxt(t){ let o=""; for(const ch of String(t)){ let c=ch==="€"?0x80:ch.charCodeAt(0); if(c!==0x80&&(c>255||(c>126&&c<160))) c=63; const s=String.fromCharCode(c); o+= s==="("||s===")"||s==="\\" ? "\\"+s : s; } return o; }
function miniPdf(draw){
  const ops=[]; let font="F1", size=10;
  const api={
    font(bold,sz){ font=bold?"F2":"F1"; size=sz; this.bold=!!bold; },
    color(r,g,b){ ops.push(`${(r/255).toFixed(3)} ${(g/255).toFixed(3)} ${(b/255).toFixed(3)} rg`); },
    text(t,x,y,align){ const w=align==="right"?pdfW(t,font==="F2",size):0; ops.push(`BT /${font} ${size} Tf ${(x-w).toFixed(2)} ${(842-y).toFixed(2)} Td (${pdfTxt(t)}) Tj ET`); },
    line(x1,y1,x2,y2,w=.8){ ops.push(`0 0 0 RG ${w} w ${x1} ${842-y1} m ${x2} ${842-y2} l S`); },
  };
  draw(api);
  const stream=ops.join("\n");
  const objs=["<< /Type /Catalog /Pages 2 0 R >>","<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>",
    `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`];
  let out="%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"; const off=[];
  objs.forEach((o,i)=>{ off.push(out.length); out+=`${i+1} 0 obj\n${o}\nendobj\n`; });
  const xref=out.length;
  out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(n=>String(n).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const u=new Uint8Array(out.length); for(let i=0;i<out.length;i++) u[i]=out.charCodeAt(i)&255;
  return new Blob([u],{type:"application/pdf"});
}

    if(c) out.push({k:"warn", chip:"Lloguer", t:`<b>${pn(x.propId)}</b><div class="small muted">Aquest cobrament no està lligat a cap contracte: ${line(x)}</div>`, act:`<button class="btn sm primary" data-act="chkLink" data-id="${x.id}|${c.id}">És de ${esc(c.tenantName||"l'inquilí")}</button>`}); });

        act:`${ms.some(x=>x.docId)?`<button class="btn sm primary" data-act="chkRead" data-id="${ms.map(x=>x.id).join(",")}">Llegeix la factura</button>`:""}<button class="btn sm${ms.some(x=>x.docId)?"":" primary"}" data-act="chkFian" data-id="${big.id}|${Math.round((got-exp)*100)/100}">Hi ha la fiança</button><button class="btn sm" data-act="chkOk" data-id="${ms.map(x=>x.id).join(",")}">És correcte</button>`}); } } });
  // 4. Imports o dates estranyes
  vm.filter(x=>!(+x.amount>0)||!isDate(x.date)).forEach(x=>out.push({k:"bad", chip:"Import", t:`<b>${pn(x.propId)}</b><div class="small muted">Moviment sense import o sense data: ${esc(x.concept||x.category||"")}</div>`, act:`<button class="btn sm" data-act="editMove" data-id="${x.id}">Arreglar</button>`}));

  current().filter(c=>c.tenantType!=="empresa" && !(+c.deposit>0) && !c.depositNone && propById(c.propId)).forEach(c=>{ const hasDoc=(c.docs||[]).length>0;

// Llegeix el document del contracte i en treu l'import de la fiança.
async function chkDep(cid){
  const c=conById(cid); if(!c) return; const d=(c.docs||[])[0]; if(!d) return;
  if(!sample){ toast(aiErr("not_granted")); return; }
  openSheet("Buscant la fiança…", `<div class="chkok"><span class="spin">⏳</span><div><b>Estic llegint el contracte</b><p class="muted">Tarda uns segons.</p></div></div>`);
  try{
    const blob=await (await fetch("/_blob/"+d.id,{credentials:"same-origin"})).blob(); let text="", imgs=[];
    if(/pdf/.test(d.mime||blob.type)){ const pdf=await loadPdf(blob); const t=await pdfText(pdf,12); if(t.chars>300) text=t.text; else for(let i=1;i<=Math.min(4,pdf.numPages);i++) imgs.push(await pageJpeg(pdf,i)); }
    else imgs.push(await prepUpload(blob));
    const r=await sample.json(`Això és un contracte de lloguer. Busca l'import de la FIANÇA (fianza, depósito, garantia). Respon NOMÉS amb JSON: {"fianca": número en euros o null si no n'hi ha o no surt, "frase": "la frase del contracte on surt, curta"}${text?"\n\n"+text.slice(0,20000):""}`, imgs.length?{images:imgs}:{});
    const v=+(r&&r.fianca)||0;
    if(v>0){ await db.doc("contracts/"+cid).update({deposit:Math.round(v*100)/100}); toast(`Fiança trobada: ${eur(v)}`); checkData(); }
    else { toast("No he trobat la fiança al contracte. Posa-la a mà."); ACT.depositForm(cid); }
  }catch(e){ console.warn(e); toast("No he pogut llegir el contracte."); checkData(); }
}
async function chkFianGo(mid){
  const x=S.moves.find(m=>m.id===mid); if(!x) return; const v=Math.round(parseFloat(String($("#chk-f").value).replace(",","."))*100)/100;
  if(!(v>0) || v>=x.amount){ toast("Posa un import més petit que el cobrament"); return; }
  try{ await db.doc("moves/"+mid).update({amount:Math.round((x.amount-v)*100)/100, okExtra:true});
    await db.collection("moves").add({type:"ingres", date:x.date, amount:v, propId:x.propId, contractId:x.contractId||"", category:"Fiança", period:x.period||ymOf(x.date), concept:"Fiança"+(x.provider?" · "+x.provider:""), provider:x.provider||"", vat:0, source:"manual", createdAt:Date.now()});

async function addRentMove(c, mo, extra={}){ setTimeout(celebrateIfFull,0);
  const r=split(c,mo), fee=r.fee||0, gross=fee>0?Math.round((r.base+r.iva-r.ret)*100)/100:r.net;
  await db.collection("moves").add({type:"ingres", date:payDate(c,mo), amount:gross, propId:c.propId, contractId:c.id, category:"Lloguer", period:mo, concept:`Lloguer ${monthName(mo)}`, provider:c.tenantName||"", vat:0, source:"marcat", createdAt:Date.now(), ...extra});
  if(false) await db.collection("moves").add({type:"despesa", date:payDate(c,mo), amount:fee, propId:c.propId, contractId:c.id, category:"Comissió plataforma", period:mo, concept:`Comissió ${c.platform||"plataforma"} ${String(c.feePct).replace(".",",")}% · ${monthName(mo)}`, provider:c.platform||"Plataforma", vat:0, source:"marcat", createdAt:Date.now()});

async function markAllPaidGo(cid, btn){

function empLedger(p, list){
  const cs=contractsOf(p.id); const near=(c,m)=>c.start && m.date>=(()=>{ const d=new Date(c.start); d.setDate(d.getDate()-15); return d.toLocaleDateString("sv-SE"); })() && (!c.end || m.date<=c.end);
  const used=new Set(); const groups=[];
  cs.forEach((c,i)=>{ const l=list.filter(m=>!used.has(m) && (m.contractId===c.id || (!m.contractId && (m.category==="Lloguer"||m.category==="Comissió plataforma") && near(c,m)))); l.forEach(m=>used.add(m)); if(l.length) groups.push({c,l,col:EMPCOL[(cs.length-1-i)%EMPCOL.length]}); });
  const rest=list.filter(m=>!used.has(m));
  const head=(g)=>{ const inc=sum(g.l.filter(m=>m.type==="ingres")), com=sum(g.l.filter(m=>m.type==="despesa")); return `<span class="edot" style="background:${g.col}"></span><span class="eg-t"><b>${esc(g.c.tenantName||"Sense nom")}</b><span class="small muted">${g.c.cif?`NIF ${esc(g.c.cif)} · `:""}${g.c.start?fmtDate(g.c.start):"?"} – ${g.c.end?fmtDate(g.c.end):"?"}${stayDays(g.c)?` (${stayDays(g.c)} dies)`:""} · ${g.l.length} moviment${g.l.length===1?"":"s"}</span></span><span class="eg-n num"><span class="pos">+${eur(inc)}</span>${com?` <span class="neg">−${eur(com)}</span>`:""}<span class="small muted">net ${eur(inc-com)}</span></span>`; };
  return `${groups.map((g,i)=>{ const fk="em-"+g.c.id, op=S.open.has(fk)||(i===0&&!S.shut.has(fk)); return `<details class="fold egrp" data-fold="${fk}"${op?" open":""}><summary>${head(g)}${CHEV}</summary>${ledger(g.l,false)}</details>`; }).join("")}
  ${rest.length?`<details class="fold egrp" data-fold="em-rest-${p.id}"${S.open.has("em-rest-"+p.id)||(!groups.length&&!S.shut.has("em-rest-"+p.id))?" open":""}><summary><span class="edot" style="background:var(--muted)"></span><span class="eg-t"><b>Despeses del pis</b><span class="small muted">${rest.length} moviment${rest.length===1?" que no és":"s que no són"} de cap empresa</span></span><span class="eg-n num">${sum(rest.filter(m=>m.type==="ingres"))?`<span class="pos">+${eur(sum(rest.filter(m=>m.type==="ingres")))}</span> `:""}<span class="neg">−${eur(sum(rest.filter(m=>m.type==="despesa")))}</span></span>${CHEV}</summary>${ledger(rest,false)}</details>`:""}
  ${!list.length?ledger(list,false):""}`;
}

let toastT; function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2800); }
// Avís amb botó "Desfer" (per si t'has equivocat).
function toastUndo(t, undo){ const el=$("#toast"); el.innerHTML=""; const sp=document.createElement("span"); sp.textContent=t; const b=document.createElement("button"); b.type="button"; b.className="tundo"; b.textContent="Desfer";
  b.onclick=async()=>{ el.hidden=true; try{ await undo(); toast("Desfet"); }catch{ toast("No s'ha pogut desfer."); } }; el.append(sp,b); el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,7000); }
const field = (label, inner) => `<label class="field"><span>${label}</span>${inner}</label>`;

async function uploadFiles(files){ const out=[]; for(const f of files){ const blob=await prepUpload(f); const r=await assets.upload(blob,{type:blob.type||"application/pdf"}); out.push({id:r.id, mime:r.contentType, name:f.name||""}); } return out; }

const POLICY_PROMPT = () => `És una pòlissa (o un rebut) d'assegurança d'un habitatge. Avui és ${today()}. Respon NOMÉS amb JSON:
{"companyia":"nom de l'asseguradora" o null,"numPolissa":"text" o null,"telefonAssistencia":"telèfon d'assistència o sinistres 24 h" o null,"venciment":"AAAA-MM-DD" o null,"avis":"text curt" o null}
"venciment" és la data de venciment o renovació de la pòlissa. No inventis res.`;

const POLICY_DONE = m => !!(m.companyia && m.numPolissa && m.telefonAssistencia);
/* automatic fill: read stored policies without asking */
const AUTO={running:false, stop:false, busy:new Set(), t:null};
function scheduleAuto(){ clearTimeout(AUTO.t); AUTO.t=setTimeout(autoFill, 900); }
function latestPolicy(pid){ return S.docs.filter(d=>d.propId===pid && d.folder==="assegurances" && d.docId).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")) || (b.createdAt||0)-(a.createdAt||0))[0]; }
async function autoFill(){
  if(AUTO.running || AUTO.stop || !sample || !db || Object.values(S.loaded).some(v=>!v)) return;
  const todo=S.props.map(p=>{ const d=latestPolicy(p.id); return d && p.insFrom!==d.docId ? {p,d} : null; }).filter(Boolean);
  if(!todo.length) return;
  AUTO.running=true;
  for(const {p,d} of todo){
    AUTO.busy.add(p.id); render();
    try{
      const res=await fetch("/_blob/"+encodeURIComponent(d.docId)); if(!res.ok) throw {code:"fetch"};
      const b=await res.blob();
      const {r}=await readDocs([new File([b], d.fileName||"polissa.pdf", {type:b.type||d.mime||"application/pdf"})], POLICY_PROMPT(), POLICY_DONE, {maxCalls:4});
      const v=(r&&typeof r==="object")?r:{}, cur=propById(p.id)||p, managed=!!cur.insFrom, upd={insFrom:d.docId, insFail:false};
      const put=(k,val)=>{ if(val!=null && val!=="" && (managed || !cur[k])) upd[k]=String(val).trim(); };
      put("insurer", v.companyia); put("policyNumber", v.numPolissa); put("insurerPhone", v.telefonAssistencia);
      if(isDate(v.venciment)) put("policyRenewal", v.venciment);
      if(!upd.insurer && !upd.policyNumber && !upd.insurerPhone && !cur.insurer && !cur.policyNumber) upd.insFail=true;
      await db.doc("props/"+p.id).update(upd);
    }catch(e){
      const c=e&&e.code;
      if(["rate_limited","not_granted","sampling_disabled","capability_disabled","capability_removed","not_declared","session_expired","upstream_error"].includes(c)) AUTO.stop=true;
      else await db.doc("props/"+p.id).update({insFrom:d.docId, insFail:true}).catch(()=>{});
    }
    AUTO.busy.delete(p.id); render();
    if(AUTO.stop) break;
  }
  AUTO.running=false;
  if(!AUTO.stop) scheduleAuto();
}

function deepMerge(a, b){
  if(!b || typeof b!=="object" || Array.isArray(b)) return a;
  for(const k of Object.keys(b)){ const v=b[k]; if(v==null || v==="") continue;
    if(typeof v==="object" && !Array.isArray(v)) a[k]=deepMerge(a[k]&&typeof a[k]==="object"?a[k]:{}, v);
    else if(a[k]==null || a[k]==="") a[k]=v; }
  return a;
}
async function splitImage(blob){
  const bmp=await createImageBitmap(blob); const sc=Math.min(1, 1800/bmp.width), W=Math.round(bmp.width*sc), H=Math.round(bmp.height*sc);
  const full=document.createElement("canvas"); full.width=W; full.height=H; const fx=full.getContext("2d"); fx.fillStyle="#fff"; fx.fillRect(0,0,W,H); fx.drawImage(bmp,0,0,W,H);
  const parts = H>W*1.25 ? [[0,Math.round(H*.54)],[Math.round(H*.46),H]] : [[0,H]];
  return Promise.all(parts.map(([a,b])=>{ const c=document.createElement("canvas"); c.width=W; c.height=b-a; c.getContext("2d").drawImage(full,0,a,W,b-a,0,0,W,b-a); return new Promise((res,rej)=>c.toBlob(x=>x?res(x):rej(new Error("canvas")),"image/jpeg",.86)); }));
}
/* Reads a document like a person would: text PDFs at once; scanned PDFs and photos page by page,
   each page split in two halves for legibility, batch after batch until `isDone(result)` holds. */
async function readDocs(files, prompt, isDone=()=>false, opts={}){
  const per=Math.max(1, Math.min(maxImg||1, 6)), maxCalls=opts.maxCalls||6, from=opts.fromPage||1, sig=opts.signal?{signal:opts.signal}:{};
  let merged={}, text="", calls=0; const sources=[];
  for(const f of files){ const isPdf=f.type==="application/pdf"||/\.pdf$/i.test(f.name||"");
    if(isPdf){ const pdf=await loadPdf(f); const t=await pdfText(pdf,60); if(t.chars>800) text+=t.text; else sources.push({pdf, n:Math.min(pdf.numPages, opts.maxPages||20)}); }
    else sources.push({img:f}); }
  if(text){ merged=deepMerge(merged, await sample.json("Text extret del document:\n"+text.slice(0,110000)+"\n\n"+prompt, sig)); calls++;
    if(!sources.length || isDone(merged)) return {r:merged, pages:0, text:true}; }
  if(!sources.length) throw {code:"nothing"};
  if(!imgOk) throw {code:"images_unavailable"};
  const total=sources.reduce((a,x)=>a+(x.n||1),0); let pageNo=0, batch=[];
  const send=async()=>{ const p1=batch[0].page, p2=batch[batch.length-1].page; if(opts.onProgress) opts.onProgress(p1,p2,total);
    const r=await sample.json(`Les imatges són fragments d'un document (pàgines ${p1}${p2!==p1?"–"+p2:""} de ${total}; cada pàgina pot venir partida en dues meitats, la de dalt i la de baix, que es solapen una mica). Llegeix-les amb atenció, també el text petit i les clàusules. Omple només el que es vegi en aquests fragments; la resta, null.\n\n`+prompt, {images:batch.map(x=>x.b), ...sig});
    merged=deepMerge(merged, r); batch=[]; calls++; };
  outer: for(const src of sources){
    const pages = src.img ? [null] : Array.from({length:src.n},(_,i)=>i+1);
    for(const n of pages){ pageNo++; if(pageNo<from) continue;
      const blob = src.img ? src.img : await pageJpeg(src.pdf, n, 1800);
      for(const b of await splitImage(blob)){ batch.push({b, page:pageNo}); if(batch.length>=per){ await send(); if(isDone(merged) || calls>=maxCalls) break outer; } }
    }
  }
  if(batch.length && !isDone(merged) && calls<maxCalls) await send();
  return {r:merged, pages:pageNo, text:false};
}

const CONTRACT_RULES = `Durada: molts contractes diuen "un any prorrogable obligatòriament per anys fins a 5 anys" (o 7 si l'arrendador és una empresa). En aquest cas "final_primer_periode" és el final de la durada inicial i "final" és la data màxima amb les pròrrogues. Exemple: inici 2025-08-08, durada un any prorrogable fins a cinc → final_primer_periode 2026-08-07, final 2030-08-07. Si el contracte no diu res de pròrrogues, "final" = "final_primer_periode".
Renda: és el total que paga l'arrendatari cada mes. Si la clàusula de renda hi suma quantitats fixes (despeses generals, comunitat, IBI…) i en dóna el total, la renda és el TOTAL. Exemple: «650 € mensuals + 13,75 € de despeses generals, fent un total de 663,75 €» → renda 663.75. Comprova sempre que la xifra en lletres i la xifra en números coincideixen.
Actualització: una carta o annex que comunica una nova renda (IPC, IRAV o acord) és una actualització: "des_de" és el primer mes que es paga la renda nova.`;
const CONTRACT_PROMPT = () => `És un document d'un lloguer d'habitatge a Espanya: un contracte, un annex o una comunicació d'actualització de renda. Avui és ${today()}.
${CONTRACT_RULES}
On trobar les dades: la data i el lloc de signatura solen ser a l'inici («En ... a 08 de agosto de 2025»); la durada a la clàusula de DURACIÓ; la renda i la fiança a la clàusula de RENTA o PRECIO (sovint escrites en lletres i xifres, p. ex. «QUINIENTOS SETENTA Y CINCO EUROS (575€)»). Si el contracte diu que la durada es compta «desde la fecha de este documento», l'inici és la data de signatura.
Respon NOMÉS amb JSON:
{"tipus":"contracte"|"annex"|"actualitzacio","inquili":"noms dels arrendataris o raó social" o null,"tipus_inquili":"particular"|"empresa","persones":"text curt" o null,"inici":"AAAA-MM-DD" o null,"final_primer_periode":"AAAA-MM-DD" o null,"final":"AAAA-MM-DD" o null,"renda":número mensual inicial o null,"fianca":número o null,"telefon":"telèfon del primer arrendatari" o null,"correu":"text" o null,"actualitzacio":{"des_de":"AAAA-MM","nova_renda":número,"percentatge":número o null,"index":"IPC|IRAV|altre"} o null,"avis":"text curt" o null}
Si l'arrendatari és una societat (S.L., S.A.…) és "empresa". No inventis res.`;
const DEED_PROMPT = `És una escriptura de compravenda d'un habitatge a Espanya. Busca la clàusula de PREU («El precio total de esta compraventa es…») i la data d'atorgament de l'escriptura (al principi: «En Granollers, a cinco de diciembre de dos mil veintitrés»). Ignora les dates i preus de compres anteriors d'altres propietaris (apartat TÍTULO o nota simple) i els imports d'hipoteques o càrregues. Respon NOMÉS amb JSON: {"preuCompra":número o null,"dataCompra":"AAAA-MM-DD" o null}`;
const MTG_PROMPT = `És una escriptura de préstec hipotecari a Espanya. Respon NOMÉS amb JSON: {"capital":número o null,"tin":número o null,"anys":número o null,"primeraQuota":"AAAA-MM" o null,"ultimaQuota":"AAAA-MM" o null,"quota":número o null}. primeraQuota/ultimaQuota: la primera i l'última quota d'amortització. "tin": el nominal del primer període (mai el TAE). No inventis res.`;
const contractDone = m => m.tipus==="actualitzacio" ? !!(m.actualitzacio&&m.actualitzacio.nova_renda!=null&&m.actualitzacio.des_de) : !!(m.inquili && m.inici && m.renda!=null && (m.final||m.final_primer_periode));
async function contractRead(files){
  conFiles=files; const show=statusNote("#cf-st");
  if(!sample){ show("La lectura automàtica no està disponible aquí. El document es desarà igualment.", true); return; }
  show(`<span class="thinking"><span class="dot"></span>Llegint el document…</span>`);
  try{
    const {r} = await readDocs(files, CONTRACT_PROMPT(), contractDone, {onProgress:(a,b,t)=>show(`<span class="thinking"><span class="dot"></span>Llegint el document… pàgines ${a}${b!==a?"–"+b:""} de ${t}</span>`)});
    const f=$("#f-con"); if(!f) return;
    const v=(r&&typeof r==="object")?r:{}; const set=(id,val)=>{ const el=$(id); if(el && val!=null && val!=="") el.value=val; };
    const a=v.actualitzacio&&typeof v.actualitzacio==="object"&&+v.actualitzacio.nova_renda>0&&/^\d{4}-\d{2}$/.test(v.actualitzacio.des_de||"")?v.actualitzacio:null;
    if(v.tipus==="actualitzacio" || (a && v.tipus!=="contracte")){
      if(!a){ show("És una actualització de renda però no he trobat la renda nova o des de quin mes s'aplica. Afegeix-la a mà a «Actualitzacions de renda».", true); return; }
      const note=[a.index&&a.index!=="altre"?a.index:"Actualització", a.percentatge!=null?"+"+String(a.percentatge).replace(".",",")+" %":""].filter(Boolean).join(" ");
      addRentRow({from:a.des_de, amount:parseAmt(a.nova_renda), note, docId:"__new"}); f.dataset.newLabel=`Actualització renda ${monthName(a.des_de,"short")} ${a.des_de.slice(0,4)}`;
      show(`He afegit l'actualització: ${eur(a.nova_renda)} al mes a partir de ${monthLabel(a.des_de)}. Desa per aplicar-la.`); return;
    }
    if(v.tipus!=="annex" || !$("#cf-tenant").value) set("#cf-tenant", v.inquili);
    if(v.tipus_inquili==="empresa"||v.tipus_inquili==="particular"){ const rb=document.querySelector(`#f-con input[name=tenantType][value=${v.tipus_inquili}]`); if(rb && !rb.checked){ rb.checked=true; rb.dispatchEvent(new Event("change",{bubbles:true})); } }
    set("#cf-people", v.persones);
    if(isDate(v.inici)) set("#cf-start", v.inici);
    if(isDate(v.final_primer_periode)) set("#cf-first", v.final_primer_periode);
    const fin = isDate(v.final) ? v.final : isDate(v.final_primer_periode) ? v.final_primer_periode : null;
    if(fin) set("#cf-end", fin);
    if(v.renda!=null) set("#cf-rent", amtStr(parseAmt(v.renda)));
    if(v.fianca!=null) set("#cf-dep", amtStr(parseAmt(v.fianca)));
    set("#cf-phone", v.telefon); set("#cf-mail", v.correu);
    if(v.tipus==="annex") f.dataset.newLabel="Annex";
    const miss=[!v.inquili&&"inquilí", !isDate(v.inici)&&"data d'inici", !fin&&"data de final", v.renda==null&&"renda"].filter(Boolean);
    show(`He omplert les dades${v.tipus==="annex"?" de l'annex":""}.${fin&&isDate(v.final_primer_periode)&&fin!==v.final_primer_periode?` Durada: primer període fins al ${fmtDate(v.final_primer_periode)} i pròrrogues fins al ${fmtDate(fin)}.`:""} Revisa-les i desa.${miss.length?" No he trobat: "+miss.join(", ")+".":""}${v.avis?" "+esc(v.avis):""}`, !!miss.length);
  }catch(e){ show((e&&e.code==="nothing"?"No he pogut llegir el fitxer.":aiErr(e&&e.code))+" El document es desarà igualment.", true); }
}

/* ================= despeses fixes de l'any (per pis) ================= */
const FREQS = {mensual:"Cada mes", trimestral:"Cada 3 mesos", semestral:"Cada 6 mesos", anual:"Un cop l'any"};
const MONTHS_CA = ["gener","febrer","març","abril","maig","juny","juliol","agost","setembre","octubre","novembre","desembre"];
function fixedMonths(it){ const m0=Math.min(12,Math.max(1,+it.month||1)); const step={mensual:1,trimestral:3,semestral:6,anual:12}[it.freq]||12; const out=[]; for(let k=0;k<12;k+=step) out.push(((m0-1+k)%12)+1); return out; }
const fixedYear = it => (+it.amount||0)*fixedMonths(it).length;
// Despeses fixes que toquen aquest mes i que encara no s'han anotat (si ja hi ha el rebut real, compta el real).
function fixedPending(p, mo){
  const mm=+mo.slice(5,7), ms=movesOf(p.id).filter(x=>x.type==="despesa"&&(x.period||ymOf(x.date))===mo);
  return (p.fixed||[]).filter(it=>fixedMonths(it).includes(mm) && !ms.some(x=>x.category===it.category && (!it.concept || norm([x.concept,x.provider].join(" ")).includes(norm(it.concept).split(" ")[0]) || x.category!=="Altres despeses")));
}
function fixedPanel(p){
  const its=p.fixed||[], tot=its.reduce((a,it)=>a+fixedYear(it),0);
  return `<section class="panel"><div class="panel-h"><div><h3>Despeses fixes de l'any</h3><p class="small muted" style="margin:2px 0 0">Les que ja saps que arribaran. Cada mes es resten del que et queda, fins que n'escanegis el rebut real.</p></div></div>
    ${its.length?`<ul class="fixl">${its.map((it,i)=>`<li><div class="t"><b>${esc(it.concept||it.category)}</b><div class="small muted">${FREQS[it.freq]||""}${it.freq!=="mensual"?" · "+fixedMonths(it).map(n=>MONTHS_CA[n-1].slice(0,3)).join(", "):""}</div></div><span class="num">${eur(it.amount)}</span><button type="button" class="ib" data-act="fixedEdit" data-id="${p.id}|${i}" title="Corregir" aria-label="Corregir ${esc(it.concept||it.category)}">${PENCIL}</button><button type="button" class="ib del" data-act="fixedDel" data-id="${p.id}|${i}" title="Treure" aria-label="Treure ${esc(it.concept||it.category)}">×</button></li>`).join("")}</ul>
      <div class="fixtot"><span>Total a l'any</span><b class="num">${eur(tot)}</b><span class="small muted">${eur(tot/12)}/mes de mitjana</span></div>`
      :`<p class="small muted">Encara no n'hi ha cap. Pots afegir-les una a una o fer que les tregui dels moviments de l'any passat.</p>`}

}
function fixedForm(key){
  const [pid, idx]=String(key).split("|"), p=propById(pid); if(!p) return; const its=[...(p.fixed||[])], it=idx==="new"?{freq:"anual", month:+today().slice(5,7), category:"IBI i taxes"}:its[+idx]; if(!it) return;

function fixedSuggest(pid){
  const p=propById(pid); if(!p) return; const to=curMonth(), from=addMonths(to,-12);
  const ms=movesOf(pid).filter(x=>x.type==="despesa" && !INVEST.includes(x.category) && x.category!=="Comissió plataforma" && x.category!=="Reparació i manteniment" && (x.period||ymOf(x.date))>=from && (x.period||ymOf(x.date))<to);
  const g={}; ms.forEach(x=>{ const k=x.category==="Altres despeses"||x.category==="Subministraments"?x.category+"|"+norm(x.provider).split(" ")[0]:x.category; (g[k]=g[k]||[]).push(x); });
  const have=new Set((p.fixed||[]).map(it=>it.category+"|"+norm(it.concept)));
  const sug=Object.values(g).map(list=>{ const months=[...new Set(list.map(x=>+(x.period||ymOf(x.date)).slice(5,7)))].sort((a,b)=>a-b), n=months.length, total=sum(list);
    const freq = n>=9?"mensual": n>=4?"trimestral": n>=2?"semestral":"anual"; const times={mensual:12,trimestral:4,semestral:2,anual:1}[freq];
    const x=list[list.length-1]; return {concept: x.category==="Comunitat"?"Comunitat":x.category==="IBI i taxes"?(x.concept||"IBI"):(x.provider||x.concept||x.category), category:x.category, amount:Math.round(total/times*100)/100, freq, month:months[0]||1}; })
    .filter(it=>!have.has(it.category+"|"+norm(it.concept)));
  if(!sug.length){ toast("No he trobat despeses repetides a l'últim any per a aquest pis."); return; }
  openSheet("Despeses de l'any passat", `<form class="form" id="f-fsug"><p style="margin:0"><b>Marca les despeses que es repetiran.</b></p><p class="small muted" style="margin:0">Si l'import no és bo, toca'l i canvia'l.</p>
    <ul class="slist">${sug.map((it,i)=>`<li class="sugrow"><label class="chk"><input type="checkbox" name="on" value="${i}" checked></label><div class="t"><b>${esc(it.concept)}</b><div class="small muted">${esc(it.category)} · ${FREQS[it.freq]}${it.freq!=="mensual"?" · "+fixedMonths(it).map(n=>MONTHS_CA[n-1].slice(0,3)).join(", "):""}</div></div><input class="amt sugamt" data-i="${i}" inputmode="decimal" value="${amtStr(it.amount)}" aria-label="Import de ${esc(it.concept)}"></li>`).join("")}</ul>
    <div class="actions"><button class="btn primary">Afegir les marcades</button></div></form>`);
  $("#f-fsug").onsubmit=async e=>{ e.preventDefault(); const on=new FormData(e.target).getAll("on").map(Number);
    const add=on.map(i=>({...sug[i], amount:parseAmt($(`.sugamt[data-i="${i}"]`).value)||sug[i].amount}));
    if(!add.length){ toast("No n'has marcat cap."); return; }
    const before=[...(p.fixed||[])];
    if(await save(()=>db.doc("props/"+pid).update({fixed:[...before, ...add]}))) toastUndo(`${add.length} despes${add.length>1?"es afegides":"a afegida"}`, ()=>db.doc("props/"+pid).update({fixed:before})); };
}

function dsHomography(src, W, H){

async function startScan(file){
  const isPdf = file.type==="application/pdf" || /\.pdf$/i.test(file.name||"");
  let preview = isPdf ? null : URL.createObjectURL(file);
  openSheet("Llegint el document", `<div class="scanwait">${preview?`<img src="${preview}" alt="Document escanejat">`:`<div class="pdfph">PDF</div>`}<div class="thinking"><span class="dot"></span>Llegint les dades…</div><p class="small muted">Sol trigar uns segons.</p><button class="btn ghost sm" data-act="closeSheet">Atura</button></div>`);
  let img;
  try{ img = isPdf ? await pageJpeg(await loadPdf(file),1) : await toJpeg(file,1600,0.85).catch(()=>file); if(isPdf) preview=URL.createObjectURL(img); }
  catch{ return moveForm({type:"despesa"}, {file, warn:true, note:"No he pogut obrir aquest PDF per llegir-lo. Omple les dades a mà; el document es desarà igualment."}); }
  if(!sample || !imgOk) return moveForm({type:"despesa"}, {file, preview, warn:true, note:"La lectura automàtica no està disponible aquí. Omple les dades a mà."});
  const ctl=new AbortController(); scanCtl=ctl;

    if(scanCtl!==ctl) return; scanCtl=null;

    moveForm(m, {file, preview, ai:true, warn:!!note, note:note||"He omplert les dades del document. Revisa-les i desa."});
  }catch(e){ if(e&&e.code==="cancelled") return; if(scanCtl!==ctl) return; scanCtl=null; moveForm({type:"despesa"}, {file, preview, warn:true, note:aiErr(e&&e.code)}); }
}

function whereIs(key){

const importedKeys = () => new Set([...S.moves.map(m=>m.srcKey), ...S.docs.map(d=>d.srcKey), ...S.contracts.flatMap(c=>(c.docs||[]).map(d=>d.srcKey))].filter(Boolean));
function addImport(list){
  const have=importedKeys(); let added=0;
  for(const {file,path} of list){
    const name=file.name||""; if(name.startsWith(".")) continue;
    if(!IMP_OK.test(name) && !/^(image\/|application\/pdf)/.test(file.type)){ IMP.skipped++; IMP.items.push({id:++IMP.seq, key:(path||name)+"|"+file.size, file, path:path||name, name, status:"error", err:`Format no compatible (${(name.split(".").pop()||"").toUpperCase()}): desa'l com a PDF o fes-ne una foto`, include:false, res:null}); continue; }

    const dup=have.has(key), big=file.size>20e6; const where=dup?whereIs(key):null;
    IMP.items.push({id:++IMP.seq, key, file, path:path||name, name, where, status: dup?"dup": big?"error":"pending", err: big?"Pesa més de 20 MB":"", include:!dup, res:null});
    added++;

}
async function filesFromDrop(dt){
  const out=[]; const entries=[...(dt.items||[])].map(i=>i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if(!entries.length) return [...dt.files].map(f=>({file:f, path:f.name}));
  const walk = async (entry, prefix) => {
    if(entry.isFile){ const f=await new Promise((res,rej)=>entry.file(res,rej)); out.push({file:f, path:prefix+f.name}); }
    else if(entry.isDirectory){ const r=entry.createReader(); let batch; do{ batch=await new Promise((res,rej)=>r.readEntries(res,rej)); for(const e of batch) await walk(e, prefix+entry.name+"/"); }while(batch.length); }
  };
  for(const e of entries) await walk(e,""); return out;
}

function impPrompt(x, text){
  const c=ctxJSON(), hp=propById(IMP.hint);
  return `Classifiques i llegeixes documents d'un propietari que lloga pisos a Espanya. Avui és ${today()}.
Ruta del fitxer: "${x.path}" (el nom de la carpeta o del fitxer sovint indica el pis o el tipus de document).${hp?`\nL'usuari està important des del pis "${hp.name}" (id ${hp.id}): pots fer-lo servir només si el document hi coincideix de debò (adreça, ref. cadastral, registre, notari, inquilí, pòlissa, dates de compra…). Si no ho pots comprovar amb dades del document, posa propietatId null: no l'assignis per defecte.`:""}
El nom de cada pis sovint és la seva ciutat (p. ex. "Pis Granollers"). Si la població del document coincideix amb el nom d'un pis i cap altre pis és d'aquesta població, això SÍ que compta com a coincidència encara que el pis no tingui adreça desada.
Pisos (JSON): ${JSON.stringify(c.pisos)}
Contractes (JSON): ${JSON.stringify(c.contractes)}
Proveïdors coneguts i el seu pis (JSON): ${JSON.stringify(c.proveidors)}
Categories de despesa: ${CATS.despesa.join(" | ")}
Categories d'ingrés: ${CATS.ingres.join(" | ")}
${text ? "Text extret del document:\n"+text : "Les imatges són el document (o les seves primeres pàgines)."}

Tipus de document:
- factura: factura o tiquet d'una despesa pagada. rebut: rebut bancari o justificant de pagament d'una despesa.
- lloguer: justificant d'un cobrament de lloguer (transferència d'un inquilí, liquidació d'una plataforma).
- escriptura: escriptura de compravenda o nota simple. contracte: NOMÉS contracte de LLOGUER (arrendament) o un annex d'un contracte de lloguer.
  Un contracte d'arres, de reserva, de compravenda, d'hipoteca, de serveis o de subministrament NO és "contracte": és "altre" (carpeta propietat si és de la compra del pis).
- actualitzacio: carta o annex que comunica una nova renda (actualització per IPC, IRAV o acord).
- foto: una fotografia real de l'edifici, la façana o l'interior d'un habitatge (no és cap document ni paper, ni una captura de pantalla). Si és una foto d'una altra cosa (persones, paisatges, objectes, captures…), és "alie".
- alie: document que NO té res a veure amb els pisos, els lloguers ni les seves despeses (p. ex. una nòmina, un document de feina, una multa del cotxe, una factura personal d'una compra que no és per a un pis, una foto qualsevol). Pensa-ho bé: en cas de dubte raonable, és "alie" i explica per què a "avis".
- altre: qualsevol altre (pòlissa, certificat energètic, cèdula, alta o canvi de titular de subministraments, domiciliació, model d'impostos, pressupost, factura proforma...).
Carpetes: propietat (escriptures de compravenda, notes simples, certificat energètic, cèdula), hipoteca (escriptura del préstec, rebuts de quotes, quadre d'amortització, certificats del banc), contractes, subministraments (altes, canvis de titular, domiciliacions, contractes de llum/aigua/gas/internet), assegurances (pòlisses), impostos (ITP, models 600, IBI, plusvàlues), factures (factures, tiquets, rebuts i pressupostos), altres.
Categories: "Despeses de compra" = ITP, notaria, registre i gestoria de la compra; "Mobiliari i millores" = mobles, electrodomèstics, obres. "Derrama" = quota extraordinària de la comunitat de propietaris per a obres o millores de l'edifici; com a "import" posa NOMÉS la part que paga aquest pis (la seva quota segons el coeficient o el repartiment per pisos), mai el total de tota la comunitat; si només hi surt el total i el coeficient del pis, calcula-la (total × coeficient %); si es paga en diversos terminis, l'import és el del rebut o termini d'aquest document i ho indiques al concepte (p. ex. "Derrama façana · termini 1 de 4"); si no es pot saber la part del pis, deixa "import" a null i explica-ho a l'avís. Una convocatòria, acta, circular o comunicat de la comunitat o de l'administrador de finques que demana pagar una derrama o quota extraordinària NO és "altre": és "rebut" amb categoria "Derrama" i porta "moviment" de despesa (encara que no sigui una factura formal); la data del moviment és la del pagament o càrrec (o la del primer termini), no la de la reunió. "Comunitat" = quotes ordinàries de la comunitat. La taxa d'escombraries va a "IBI i taxes".
Un justificant de pagament i la factura de la mateixa compra són la mateixa despesa: si veus que pot ser el cas, explica-ho a "avis".
Els rebuts de quotes d'hipoteca són "altre" a la carpeta "hipoteca", sense moviment: les quotes es calculen soles.
Plataformes (p. ex. Homy Space): una LIQUIDACIÓ o resum de pagament de la plataforma és "lloguer": a "moviment" posa "import" = el que realment rep el propietari (net), "brut" = la renda abans de comissió i "comissio" = la comissió descomptada; "contracteId" = el contracte de l'empresa que hi surt (busca-la per nom o CIF a Contractes); "periode" = el mes que paga. Una FACTURA de la plataforma per la seva comissió («servicios de intermediación», Homyspace) és "factura" amb categoria "Comissió plataforma", proveïdor la plataforma (no el propietari), "import" = TOTAL amb IVA, "iva" = l'IVA, i "contracteId" = el contracte de l'empresa del mateix període o referència de reserva. Una factura que el PROPIETARI emet a l'empresa pel lloguer és "lloguer" (ingrés): "import" = el total de la factura i "periode" = el mes en què comença el període facturat.
Un RESGUARD, rebut o factura de FIANÇA (dipòsit) que emet la plataforma o l'empresa NO és cap despesa ni ingrés: és "altre" a la carpeta "contractes", amb "contracteId" de l'empresa i "fianca_import" = l'import de la fiança.
Contractes d'empreses (lloguer de temporada a una empresa per als seus treballadors, sovint a través d'una plataforma): "inquili" = raó social de l'empresa.

Respon NOMÉS amb JSON:
{"tipus_document":"factura|rebut|lloguer|escriptura|contracte|actualitzacio|foto|alie|altre","carpeta":"propietat|contractes|subministraments|assegurances|impostos|factures|altres","resum":"3 a 8 paraules en català","data_document":"AAAA-MM-DD" o null,"propietatId":"id" o null,"contracteId":"id" o null,
"moviment":{"tipus":"despesa|ingres","data":"AAAA-MM-DD","import":número,"iva":número o null,"proveidor":"text","concepte":"text curt","categoria":"categoria exacta","periode":"AAAA-MM" o null,"brut":número o null,"comissio":número o null} o null,"fianca_import":número o null,
"escriptura":{"adreca":"text","refCadastral":"text","preuCompra":número,"dataCompra":"AAAA-MM-DD","superficie":número} o null,
"contracte":{"inquili":"text","tipus_inquili":"particular|empresa","inici":"AAAA-MM-DD","final_primer_periode":"AAAA-MM-DD","final":"AAAA-MM-DD","renda":número,"fianca":número,"telefon":"text","es_annex":true|false} o null,
"actualitzacio":{"inquili":"text","des_de":"AAAA-MM","nova_renda":número,"percentatge":número o null,"index":"IPC|IRAV|altre"} o null,
"hipoteca":{"banc":"text","capital":número,"tin":número,"anys":número,"primeraQuota":"AAAA-MM","ultimaQuota":"AAAA-MM","quota":número,"tipus":"Fix|Variable|Mixt"} o null,
"avis":"text curt" o null}
A "escriptura", "dataCompra" és la data d'atorgament de la compravenda on compra el propietari actual i "preuCompra" el preu total d'aquesta compravenda; mai les dates o preus de compres anteriors (apartat TÍTULO o nota simple) ni imports d'hipoteques. Omple "hipoteca" només si el document és l'escriptura o les condicions d'un préstec hipotecari. A "hipoteca", primeraQuota/ultimaQuota són la primera i l'última quota d'amortització (no la data de signatura) i "tin" és el nominal (mai el TAE; si n'hi ha, el bonificat).
${CONTRACT_RULES}
Afegeix sempre "adreca_immoble": l'adreça de l'habitatge que surt al document (no la del propietari), o null.
Afegeix sempre "referencia": el número identificatiu principal del document si n'hi ha (núm. de factura, de pòlissa, de protocol notarial, d'expedient, de rebut…), o null.
Afegeix sempre "coincidencia": text curt amb la dada concreta del document que el lliga al pis triat (p. ex. "Registre de La Carolina, com a les notes de Pis Bailen"), o null si no n'hi ha.
Omple "moviment" només per a factura, rebut i lloguer. Tria el pis per l'adreça, la referència cadastral, la carpeta o el proveïdor; si no n'estàs segur, null. No inventis res.`;
}
function normImp(r, x){
  r=(r&&typeof r==="object"&&!Array.isArray(r))?r:{};
  const kind=KINDS[r.tipus_document]?r.tipus_document:"altre";
  let propId=propById(r.propietatId)?r.propietatId:""; if(kind==="alie") propId="";
  const contractId=conById(r.contracteId)&&conById(r.contracteId).propId===propId?r.contracteId:"";
  const fileDate=new Date(x.file.lastModified||Date.now()).toLocaleDateString("sv-SE");
  let move=null;
  if(["factura","rebut","lloguer"].includes(kind)){
    const mv=r.moviment&&typeof r.moviment==="object"?r.moviment:{};
    const type=kind==="lloguer"?"ingres":(mv.tipus==="ingres"?"ingres":"despesa");
    move={type, date:isDate(mv.data)?mv.data:(isDate(r.data_document)?r.data_document:fileDate), amount:mv.import==null?0:parseAmt(mv.import), vat:mv.iva==null?"":parseAmt(mv.iva),
      provider:mv.proveidor?String(mv.proveidor):"", concept:mv.concepte?String(mv.concepte):(r.resum?String(r.resum):""),
      category:CATS[type].includes(mv.categoria)?mv.categoria:(type==="ingres"?"Lloguer":"Altres despeses"), period:typeof mv.periode==="string"&&/^\d{4}-\d{2}$/.test(mv.periode)?mv.periode:"", contractId};
    const br=mv.brut==null?0:parseAmt(mv.brut), co=mv.comissio==null?0:parseAmt(mv.comissio);

const impClear = x => { const r=x.res; if(!r || x.status!=="ready" || !x.include || r.dup || r.kind==="alie" || r.other || r.unsure || r.verify || r.kind==="foto") return false; if(!r.propId) return false; if(r.move && !r.move.amount) return false; return true; };

async function impSave(auto){
  if(IMP.saving) return;
  if(!assets){ IMP.msg="En aquesta vista no es poden desar documents."; render(); return; }
  const list=IMP.items.filter(x=> auto ? impClear(x) : (x.status==="ready"&&x.include));
  IMP.saving=true; IMP.msg=""; render(); let ok=0, skip=0; const kinds={};
  for(const x of list){
    const r=x.res;
    if((!r.move && !r.propId) || (r.move && !r.move.amount)){ skip++; continue; }
    if(x.removed){ x.status="removed"; continue; }
    try{ x.t0=Date.now()-1000; const k=await impSaveOne(x); x.kindSaved=k; kinds[k]=(kinds[k]||0)+1; x.status="saved"; ok++; render(); }
    catch(e){ x.status="error"; x.err=upErr(e).split(".")[0]; render(); if(e&&e.code==="quota_or_state") break; }
  }
  IMP.saving=false;
  const parts=[["moviment","moviment","moviments"],["contracte","contracte","contractes"],["actualitzacio","actualització de renda","actualitzacions de renda"],["foto","foto del pis","fotos del pis"],["document","document","documents"]].filter(([k])=>kinds[k]).map(([k,a,b])=>`${kinds[k]} ${kinds[k]===1?a:b}`);
  const dups=IMP.items.filter(x=>x.status==="dup");
  const dupTxt = dups.length ? ` ${dups.length===1?"1 document ja el tenies desat":dups.length+" documents ja els tenies desats"} i no l'he${dups.length>1?"s":""} duplicat: ${[...new Set(dups.map(x=>x.where?x.where.txt.split(" › ")[0]:""))].filter(Boolean).join(", ")}.` : "";
  const summary0 = ok ? `He llegit i desat ${ok} document${ok>1?"s":""}: ${parts.join(", ")}. Cada un és al seu pis amb les dades omplertes.` : "";
  const left=IMP.items.filter(x=>x.status==="ready");
  for(const x of left){ try{ await parkInbox(x); }catch{ x.status="error"; x.err="No s'ha pogut guardar per revisar"; } }
  SCANCTX.last = ok ? `${ok} desat${ok>1?"s":""}: ${parts.join(", ")}` : "";
  render();
}

/* ================= document viewer ================= */
let VIEW=null;
async function viewDoc(id, mime, name){
  closeViewer();
  const tok={}; VIEW=tok;
  $("#viewer-root").innerHTML=`<div class="viewer" role="dialog" aria-modal="true" aria-label="Document"><div class="vh"><button class="btn sm" data-vclose="1">← Tornar</button><b>${esc(name||"Document")}</b><button class="btn sm" id="v-save" hidden>Desar al dispositiu</button></div>
    <div class="vb" id="v-body"><div class="thinking" style="margin-top:30px"><span class="dot"></span>Obrint el document…</div></div></div>`;
  const body=()=>$("#v-body");
  let blob;
  try{ const r=await fetch("/_blob/"+encodeURIComponent(id)); if(!r.ok) throw new Error(r.status); blob=await r.blob(); }
  catch{
    if(VIEW!==tok) return;
    if(!/^application\/pdf/.test(mime||"")){ body().innerHTML=`<img src="/_blob/${esc(id)}" alt="${esc(name||"Document")}">`; return; }
    body().innerHTML=`<div class="empty"><p>No s'ha pogut obrir el document. Comprova la connexió i torna-ho a provar.</p></div>`; return;
  }
  if(VIEW!==tok) return;
  const type=blob.type||mime||"";
  tok.blob=blob; tok.name=name;
  const sv=$("#v-save"); if(sv && downloadsCap) sv.hidden=false;
  if(/^image\//.test(type)){ tok.url=URL.createObjectURL(blob); body().innerHTML=`<img src="${tok.url}" alt="${esc(name||"Document")}">`; return; }
  try{
    const pdf=await loadPdf(blob); if(VIEW!==tok) return;
    body().innerHTML=""; const w=Math.min(body().clientWidth-8, 1000), dpr=Math.min(2, window.devicePixelRatio||1);
    for(let i=1;i<=pdf.numPages;i++){
      if(VIEW!==tok) return;
      const page=await pdf.getPage(i), v1=page.getViewport({scale:1}), vp=page.getViewport({scale:(w/v1.width)*dpr});
      const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height; c.style.width=Math.round(vp.width/dpr)+"px";
      body().appendChild(c);
      if(pdf.numPages>1){ const l=document.createElement("div"); l.className="pg"; l.textContent=`Pàgina ${i} de ${pdf.numPages}`; body().appendChild(l); }
      await page.render({canvasContext:c.getContext("2d"), viewport:vp}).promise;
    }
  }catch{ if(VIEW===tok) body().innerHTML=`<div class="empty"><p>Aquest fitxer no es pot mostrar aquí.</p></div>`; }
}
function closeViewer(){ if(VIEW&&VIEW.url) URL.revokeObjectURL(VIEW.url); VIEW=null; const r=$("#viewer-root"); if(r) r.innerHTML=""; }
async function saveViewed(){
  if(!VIEW||!VIEW.blob||!downloadsCap) return;
  const ext = /pdf/.test(VIEW.blob.type) ? ".pdf" : /png/.test(VIEW.blob.type) ? ".png" : ".jpg";
  let fn=(VIEW.name||"document").replace(/[\\/:*?"<>|]+/g,"-").trim(); if(!/\.(pdf|jpe?g|png|webp|gif)$/i.test(fn)) fn+=ext;
  try{ await downloadsCap.save({filename:fn, data:VIEW.blob}); }catch(e){ if(!e||e.code!=="cancelled"&&e.code!=="declined") toast("No s'ha pogut desar el fitxer."); }
}
