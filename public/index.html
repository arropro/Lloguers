  allPaidMonth: async () => { const m=curMonth(); const cs=current().filter(c=>!rentPaid(c,m) && !(c.unpaid||[]).includes(m)); try{ for(const c of cs) await addRentMove(c,m); toast(`${cs.length} lloguer${cs.length>1?"s":""} de ${monthName(m)} anotats`); }catch{ toast("No s'ha pogut desar."); } }, markAllPaid: id => markAllPaidForm(id), markAllPaidGo,
  payOther: key => { const [cid,mo]=key.split("|"); const c=conById(cid); if(!c) return; const r=split(c,mo); moveForm({type:"ingres", date:payDate(c,mo), amount:r.net, propId:c.propId, contractId:c.id, category:"Lloguer", period:mo, provider:c.tenantName, concept:`Lloguer ${monthName(mo)}`}); },
  markUnpaid: async key => { const [cid,mo]=key.split("|"); const c=conById(cid); try{ await db.doc("contracts/"+cid).update({unpaid:[...new Set([...(c.unpaid||[]), mo])]}); closeSheet(); toast(`${monthLabel(mo)} marcat com a no cobrat`); }catch{ toast("No s'ha pogut desar."); } },
  clearUnpaid: async key => { const [cid,mo]=key.split("|"); const c=conById(cid); try{ await db.doc("contracts/"+cid).update({unpaid:(c.unpaid||[]).filter(x=>x!==mo)}); closeSheet(); toast("Marca treta"); }catch{ toast("No s'ha pogut desar."); } },
  flashClose: () => { S.flash=""; render(); },
  askDelContract, askDelProp,
  noMissing: async key => { const i=key.indexOf("|"), pid=key.slice(0,i), k=key.slice(i+1); const p=propById(pid); if(!p) return; try{ await db.doc("props/"+pid).update({noMissing:[...new Set([...(p.noMissing||[]), k])]}); toast("D'acord, ho descarto i no t'ho tornaré a preguntar"); }catch{ toast("No s'ha pogut desar."); } },
  inSave: key => { const [id,pid]=key.split("|"); inboxSave(id,pid); },
  inDrop: id => inboxDrop(id),
  inReview: id => inboxReview(id),
  openDocsClose: id => { closeSheet(); S.view="props"; S.propId=id; S.tab="documents"; render(); go(); },
  alienDrop: id => { const h=IMP.hint||SCANCTX.hint||""; IMP.items=IMP.items.filter(i=>i.id!==+id);
    const more=IMP.items.some(i=>i.status==="ready"&&i.res&&(i.res.dup||i.res.other||i.res.unsure||i.res.kind==="alie"||i.res.kind==="foto"));
    impBack(); render(); if(more) checkAlert([]); else scanPick(h); toast("Document descartat"); },
  alienDropAll: () => { const h=IMP.hint||SCANCTX.hint||""; IMP.items=IMP.items.filter(x=>!(x.status==="ready"&&x.res&&x.res.kind==="alie"));
    impBack(); render(); scanPick(h); toast("Documents descartats"); },
  alienUndo: id => { const x=IMP.items.find(i=>i.id===+id); if(x){ x.status="ready"; x.include=false; } render(); toast("Recuperat: tria el pis i prem Desar"); },
  dupKeep: async id => { const x=IMP.items.find(i=>i.id===+id); if(!x) return; x.res.dup=""; x.include=true;
    if(x.res.propId && !x.res.other && !x.res.unsure && x.res.kind!=="alie"){ try{ await impSaveOne(x); x.status="saved"; toast("Desat"); }catch(e){ toast(upErr(e)); } }
    if(IMP.items.some(i=>i.status==="ready"&&i.res&&(i.res.dup||i.res.other||i.res.unsure||i.res.kind==="alie"||i.res.kind==="foto"))) checkAlert([]); else closeSheet();
    impBack(); render(); },
  otherTo: async key => { const [id,pid]=key.split("|"); const x=IMP.items.find(i=>i.id===+id); if(!x||!assets) return; x.res.propId=pid; x.res.other=""; x.res.unsure=false; x.res.contractId="";
    try{ await impSaveOne(x); x.status="saved"; toast("Desat a "+(propById(pid)||{}).name); }catch(e){ toast(upErr(e)); }
    if(IMP.items.some(i=>i.status==="ready"&&i.res&&(i.res.dup||i.res.other||i.res.unsure||i.res.kind==="alie"||i.res.kind==="foto"))) checkAlert([]); else closeSheet();
    impBack(); render(); },
  alienKeep: () => { closeSheet(); S.view="import"; render(); toast("Tria el pis al desplegable i prem Desar"); },
  depositOk: async id => { try{ await db.doc("contracts/"+id).update({incasol:true}); toast("Fiança marcada com a dipositada"); }catch{ toast("No s'ha pogut desar."); } },
  propVacant: async id => { try{ await db.doc("props/"+id).update({vacant:true}); toast("D'acord, no et preguntaré pel contracte d'aquest pis"); }catch{ toast("No s'ha pogut desar."); } },
  policyRenewed: async id => { const p=propById(id); const r=nextRenew(p&&p.policyRenewal); if(!r) return; const [y,mm,dd]=r.split("-"); try{ await db.doc("props/"+id).update({policyRenewal:`${+y+1}-${mm}-${dd}`}); toast("Venciment passat a l'any que ve"); }catch{ toast("No s'ha pogut desar."); } }, delMortgage: async id => { try{ await db.doc("props/"+id).update({mortgage:null}); closeSheet(); toast("Hipoteca treta"); }catch{ toast("No s'ha pogut desar."); } },
  unlinkDoc: id => { const f=$("#f-con"); if(f && f._unlink) f._unlink(+id); },
  newMove: id => moveForm({propId:id||""}), editMove: id => moveForm(S.moves.find(x=>x.id===id)), delMove,
  quickRent, scan: id => scanPick(id), closeSheet, delDoc,
  impDrop: id => { const x=IMP.items.find(i=>i.id===+id); if(!x) return; x.removed=true; x.include=false; if(x.status==="pending") x.status="removed"; if(SCANCTX.count>0) SCANCTX.count--; toast("D'acord, no el guardo"); render(); },
  impUndo: async id => { const x=IMP.items.find(i=>i.id===+id); if(!x||!x.up) return;
    if(!confirm(`Treure «${x.name}» de l'app? S'esborrarà el que s'ha desat d'aquest document.`)) return;
    try{
      const fid=x.up.id;
      for(const m of S.moves.filter(m=>m.docId===fid || (m.srcKey===x.key && (m.createdAt||0)>=x.t0))){
        if((m.createdAt||0)>=x.t0) await db.doc("moves/"+m.id).delete();
        else await db.doc("moves/"+m.id).update({docId:"", docMime:"", docName:""});
      }
      for(const d of S.docs.filter(d=>d.docId===fid)) await db.doc("docs/"+d.id).delete();
      const still=S.moves.some(m=>m.docId===fid)||S.docs.some(d=>d.docId===fid)||S.contracts.some(c=>(c.docs||[]).some(z=>z.id===fid))||S.props.some(p=>p.photo&&p.photo.id===fid);
      if(!still && assets) await assets.delete(fid).catch(()=>{});
      x.status="removed"; if(SCANCTX.count>0) SCANCTX.count--; toast("Fet, no s'ha guardat"); render();
    }catch{ toast("No s'ha pogut treure. Torna-ho a provar."); } },
  impRun, impStop, impSave, impEdit, impRetry: id => { const x=IMP.items.find(i=>i.id===+id); if(x){ x.status="pending"; x.err=""; impRun(); } },
  impClear: () => { IMP.items=[]; IMP.skipped=0; IMP.msg=""; IMP.hint=""; S.view="resum"; render(); }
};
document.addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target && e.target.matches && e.target.matches("div.fcard[data-act]")){ e.preventDefault(); e.target.click(); } });
document.addEventListener("click", e=>{
  if(e.target.closest("[data-vclose]")) return closeViewer();
  const cp=e.target.closest("[data-copy]"); if(cp){ e.preventDefault(); e.stopPropagation(); const v=cp.dataset.copy;
    try{ navigator.clipboard.writeText(v).then(()=>toast("Copiat: "+v), ()=>toast("Mantén premut el número per copiar-lo")); }catch{ toast("Mantén premut el número per copiar-lo"); } return; }
  if(e.target.id==="v-save") return saveViewed();
  const dv=e.target.closest("[data-doc]"); if(dv){ e.preventDefault(); e.stopPropagation(); viewDoc(dv.dataset.doc, dv.dataset.mime, dv.dataset.name); return; }
  if(e.target.closest("[data-stop]")) return;
  if(e.target.id==="sheet") return closeSheet();
  const b=e.target.closest("[data-act]"); if(!b) return;
  if(b.dataset.confirm){
    if(!b.dataset.armed){ e.preventDefault(); e.stopPropagation(); b.dataset.armed=String(Date.now()); const old=b.textContent; b.textContent=b.dataset.confirm; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent=old; } },5000); return; }
    if(Date.now()-(+b.dataset.armed)<700){ e.preventDefault(); return; }
  }
  if(!db && b.dataset.act!=="closeSheet") return;
  const fn=ACT[b.dataset.act]; if(fn){ e.preventDefault(); fn(b.dataset.id, b); }
});
document.addEventListener("change", async e=>{
  const t=e.target;
  if(t.dataset && t.dataset.photo){ const f=t.files&&t.files[0]; t.value=""; if(!f) return; if(!assets){ toast("Aquí no es poden pujar fotos."); return; }
    toast("Pujant la foto…"); try{ const b=await toJpeg(f,1600,0.85).catch(()=>f); const up=await assets.upload(b,{type:b.type||"image/jpeg"}); await db.doc("props/"+t.dataset.photo).update({photo:{id:up.id, mime:up.contentType||"image/jpeg"}}); toast("Foto posada"); }catch(err){ toast(upErr(err)); } return; }
  if(t.dataset && t.dataset.change){ if(t.dataset.change==="py") S.py=t.value; else S.f[t.dataset.change]=t.value; render(); return; }
  if(t.dataset && t.dataset.insave){ if(t.value) inboxSave(t.dataset.insave, t.value); return; }
  if(t.dataset && t.dataset.docfolder){ try{ await db.doc("docs/"+t.dataset.docfolder).update({folder:t.value}); toast("Document mogut a "+folderNameOf(t.value)); }catch{ toast("No s'ha pogut moure."); } return; }
  if(t.id==="imp-dir"||t.id==="imp-files"){ const n=addImport([...t.files].map(f=>({file:f, path:f.webkitRelativePath||f.name}))); t.value=""; if(n) toast(`${n} documents afegits`); return; }
  const k=t.dataset && t.dataset.imp; if(!k) return; const x=IMP.items.find(i=>i.id===+t.dataset.k); if(!x) return;
  if(k==="inc") x.include=t.checked;
  if(k==="folder") x.res.folder=t.value;
  if(k==="prop"){ x.res.propId=t.value; if(x.res.kind==="alie" && t.value){ x.res.kind="altre"; x.res.folder=x.res.folder||"altres"; x.include=true; } if(x.res.contractId && (!conById(x.res.contractId)||conById(x.res.contractId).propId!==t.value)) x.res.contractId=""; if(x.res.move) x.res.move.contractId=x.res.contractId; render(); }
});
document.addEventListener("toggle", e=>{ const d=e.target; if(d.matches && d.matches("details[data-folder]") && S.propId) S.open[S.propId+d.dataset.folder]=d.open; }, true);
document.addEventListener("keydown", e=>{ if(e.key!=="Escape") return; if(VIEW) closeViewer(); else if($("#sheet")) closeSheet(); });
document.addEventListener("paste", e=>{
  if(!$("#sc-drop") && !$("#sc-paste")) return;
  const fs=[...((e.clipboardData&&e.clipboardData.files)||[])].filter(f=>/^image\/|application\/pdf/.test(f.type));
  e.preventDefault(); const pb=$("#sc-paste"); if(pb) pb.innerHTML=`<b>Enganxa aquí</b><span>Mantén premut i tria «Enganxar»</span>`;
  if(!fs.length){ toast("No hi ha cap imatge per enganxar. Copia primer la foto des de la galeria."); return; }
  startImport(fs.map((f,i)=>({file:new File([f], f.name&&f.name!=="image.png"?f.name:`foto-${Date.now()}-${i}.${(f.type.split("/")[1]||"jpg").replace("jpeg","jpg")}`, {type:f.type, lastModified:Date.now()}), path:""})));
});
const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types||[])].includes("Files");
document.addEventListener("dragover", e=>{ if(!hasFiles(e)) return; e.preventDefault(); document.body.classList.add("dragging"); const d=$("#sc-drop"); if(d) d.classList.add("over"); });
document.addEventListener("dragleave", e=>{ if(!e.relatedTarget){ document.body.classList.remove("dragging"); const d=$("#sc-drop"); if(d) d.classList.remove("over"); } });
document.addEventListener("drop", async e=>{ if(!hasFiles(e)) return; e.preventDefault(); document.body.classList.remove("dragging"); const dz=$("#sc-drop"); if(dz) dz.classList.remove("over"); if(!db) return;
  SCANCTX.hint = S.view==="props" && S.propId ? S.propId : (S.view==="import" ? IMP.hint : "");
  try{ startImport(await filesFromDrop(e.dataTransfer)); }catch{ toast("No s'han pogut llegir els fitxers. Prova amb el botó Escanejar."); } });

render();
